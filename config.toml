baseURL = "https://techlog.122113.xyz/"
languageCode = "zh-cn"
title = "TechLog 技术日志"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

[homeInfoParams]
  Title = "TechLog 技术日志"
  Content = "记录日常技术运维与情报追踪：内核版本、软件更新、价格变动、硬件调研。"

[params]
  env = "production"
  description = "IT 运维与技术情报日志：内核跟踪、软件更新、价格变动、硬件调研"
  keywords = ["运维", "Linux", "Kylin", "Caddy", "技术日志"]
  defaultTheme = "light"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  hideFooter = false
  comments = false
  dateFormat = "2006-01-02"

